services:
  app:
    build: .
    container_name: alice-301-backend
    restart: unless-stopped
    ports:
      # Порт хоста занят? Запустите с HOST_PORT=8001 docker compose up.
      - "${HOST_PORT:-8000}:8000"
    environment:
      # development открывает /docs и /redoc — для демо это и нужно.
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - YANDEX_REDIRECT_URI=${YANDEX_REDIRECT_URI:-http://localhost:8000/auth/callback}
      # Пробрасываются с хоста или из .env, если заданы. SECRET_KEY без значения
      # приложение сгенерирует само при старте.
      - SECRET_KEY
      - YANDEX_CLIENT_ID
      - YANDEX_CLIENT_SECRET
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
