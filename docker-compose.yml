# docker-compose.yml для LOKAL Cloud Service

version: '3.8'

services:
  app:
    # Указываем Docker Compose собрать образ из текущей директории
    build: .
    
    # Даем контейнеру постоянное имя
    container_name: lokal-app
    
    # Всегда перезапускать, если не остановлен вручную
    restart: unless-stopped
    
    # Пробрасываем порты: <хост>:<контейнер>
    # 127.0.0.1 ограничивает доступ к порту только с хост-машины
    # (идеально для Nginx из другого LXC, если он обращается к хосту)
    ports:
      - "8000:8000"
    
    # Пробрасываем папки (volumes) для сохранения данных
    volumes:
      # Папка с "базой данных"
      - ./db:/app/db
      # Файл с секретным ключом
      - ./.env:/app/.env
